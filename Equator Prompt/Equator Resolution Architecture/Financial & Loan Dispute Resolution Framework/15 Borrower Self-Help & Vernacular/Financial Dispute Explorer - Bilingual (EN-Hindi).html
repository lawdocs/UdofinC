function recommend(){const routes=new Set([...state.dtypes].map(function(k){var o=DTYPES.find(function(d){return d.k===k;});return o&&o.route;}));
 if(routes.has("drt"))return {c:"var(--red)", en:"DRT / SARFAESI (special forum)", hi:"DRT / SARFAESI (विशेष मंच)", note_en:"Bank/FI enforcement of security goes to the Debts Recovery Tribunal (non-arbitrable). Equator can still mediate any settlement.", note_hi:"बैंक/FI द्वारा प्रतिभूति की वसूली ऋण वसूली न्यायाधिकरण (DRT) में जाती है (गैर-मध्यस्थ)। Equator फिर भी समझौते पर मध्यस्थता कर सकता है।"};
 if(routes.has("ni138"))return {c:"var(--green)", en:"Mediation → compounding / Lok Adalat", hi:"मध्यस्थता → कंपाउंडिंग / लोक अदालत", note_en:"A dishonoured cheque (s.138) is best settled: mediate, then compound (s.147) or record in a Lok Adalat. Escrow secures the payment.", note_hi:"बाउंस हुआ चेक (धारा 138) सबसे अच्छे से निपटता है: मध्यस्थता करें, फिर कंपाउंड (धारा 147) करें या लोक अदालत में दर्ज करें। एस्क्रो भुगतान सुरक्षित करता है।"};
 if(routes.has("harassment"))return {c:"var(--gold)", en:"Grievance + mediation (harassment)", hi:"शिकायत + मध्यस्थता (उत्पीड़न)", note_en:"Recovery agents must follow the RBI Fair Practices Code. We escalate the harassment AND mediate the debt. If in danger, contact the police.", note_hi:"वसूली एजेंटों को RBI फेयर प्रैक्टिसेज़ कोड का पालन करना होगा। हम उत्पीड़न को बढ़ाते हैं और ऋण पर मध्यस्थता करते हैं। खतरे में हों तो पुलिस से संपर्क करें।"};
 if(routes.has("grievance"))return {c:"var(--gold)", en:"RBI grievance / Ombudsman + mediation", hi:"RBI शिकायत / लोकपाल + मध्यस्थता", note_en:"First complain to the lender's grievance officer; if unresolved in 30 days, escalate free to the RBI Ombudsman (cms.rbi.org.in). Equator mediates in parallel.", note_hi:"पहले ऋणदाता के शिकायत अधिकारी को शिकायत करें; 30 दिनों में हल न हो तो नि:शुल्क RBI लोकपाल (cms.rbi.org.in) तक जाएँ। Equator साथ-साथ मध्यस्थता करता है।"};
 return {c:"var(--green)", en:"Mediation / conciliation & one-time settlement", hi:"मध्यस्थता / सुलह एवं एकमुश्त समझौता", note_en:"Your matter suits a mediated settlement (OTS) — a negotiated figure, secured by escrow, released against a No-Dues/NOC, enforceable as a decree (s.27).", note_hi:"आपका मामला मध्यस्थ समझौते (OTS) के लिए उपयुक्त है — तय राशि, एस्क्रो द्वारा सुरक्षित, NOC पर जारी, डिक्री के रूप में लागू (धारा 27)।"};}
function stepSummary(){const r=recommend();const dts=[...state.dtypes];const ots=[...state.relief].some(function(x){return /ots|noc|recover/.test(x);})||dts.some(function(t){return /default|ots/.test(t);});
 var html='<div class="step"><h1>'+L('sumT')+'</h1><div class="sub">'+L('sumSub')+'</div>';
 if(dts.indexOf("harass")>=0)html+='<div class="banner b-red"><b>'+L('rightsBanner')+'</b></div>';
 html+='<div class="sumcard"><h3>'+L('recRoute')+'</h3><span class="badge" style="background:'+r.c+'">'+nmeL(r)+'</span><div style="margin-top:8px"><div class="kv">• '+r['note_'+lang]+'</div></div></div>';
 html+='<div class="sumcard"><h3>'+L('appLaw')+'</h3>'+(dts.length?dts.map(function(k){var o=DTYPES.find(function(d){return d.k===k;});return '<div class="kv">• <b>'+nmeL(o)+':</b> '+o['law_'+lang]+'</div>';}).join(''):'<div class="muted">—</div>')+'</div>';
 html+='<div class="sumcard"><h3>'+L('outcomes')+'</h3><div>'+([...state.relief].length?[...state.relief].map(function(k){var o=RELIEF.find(function(d){return d.k===k;});return '<span class="pill">'+nmeL(o)+'</span>';}).join(''):'<span class="muted">'+L('none')+'</span>')+'</div></div>';
 if(ots)html+='<div class="banner b-gold"><b>'+L('otsBanner')+'</b></div>';
 html+='<div class="sumcard"><h3>'+L('draftH')+'</h3><div class="muted" style="margin-bottom:8px">'+L('draftSub')+'</div><button class="b primary" onclick="draft(\'grievance\')">'+L('draftG')+'</button> <button class="b ghost" onclick="draft(\'request\')">'+L('draftR')+'</button></div>';
 html+='<div class="sumcard"><h3>'+L('howH')+'</h3><div class="kv">• '+L('how1')+'</div><div class="kv">• '+L('how2')+'</div><div class="kv">• '+L('how3')+'</div></div>';
 html+='<a class="cta" href="https://www.equatorresolution.com" target="_blank" rel="noopener">'+L('cta')+'</a>';
 html+='<div class="nav"><button class="b ghost" onclick="go(-1)">'+L('back')+'</button><button class="b ghost" onclick="restart()">'+L('startover')+'</button></div>';
 html+='<div class="disc">'+L('proto')+'</div></div>';
 app.innerHTML=html;}
function restart(){Object.assign(state,{who:null,loan:"",amount:"",dtypes:new Set(),relief:new Set(),facts:"",secured:"no"});step=0;render();}
function draft(kind){const facts=(state.facts||"").split(/\n|(?<=\.)\s+/).map(function(s){return s.trim();}).filter(Boolean);
 const dts=[...state.dtypes].map(function(k){return nmeL(DTYPES.find(function(d){return d.k===k;}));});
 const rel=[...state.relief].map(function(k){return nmeL(RELIEF.find(function(d){return d.k===k;}));});
 var head=lang==='hi'?'समाधान अनुरोध (मसौदा)':'REQUEST FOR RESOLUTION (DRAFT)';
 var t=(kind==='grievance'?(lang==='hi'?'शिकायत (मसौदा)':'GRIEVANCE / COMPLAINT (DRAFT)'):head)+"\n"
  +(lang==='hi'?'(AI-सहायित — भेजने से पहले समीक्षा करें और वकील से अंतिम रूप दिलवाएँ)':'(AI-assisted — review and have counsel settle before sending)')+"\n\n"
  +(lang==='hi'?'प्रति: ':'To: ')+(kind==='grievance'?(lang==='hi'?'[ऋणदाता] शिकायत अधिकारी':'[Lender] grievance officer'):'Equator Resolution')+"\n\n"
  +(lang==='hi'?'विवाद की प्रकृति:\n':'NATURE OF THE MATTER:\n')+(dts.length?dts.map(function(x,i){return '('+(i+1)+') '+x;}).join("\n"):(lang==='hi'?'[मुद्दा]':'[issue]'))+"\n\n"
  +(lang==='hi'?'तथ्य:\n':'FACTS:\n')+(facts.length?facts.map(function(f,i){return (i+1)+'. '+f;}).join("\n"):(lang==='hi'?'1. [तथ्य लिखें]':'1. [state the facts]'))+"\n\n"
  +(lang==='hi'?'वांछित राहत:\n':'RELIEF SOUGHT:\n')+(rel.length?rel.map(function(x,i){return '('+String.fromCharCode(97+i)+') '+x+';';}).join("\n"):(lang==='hi'?'(क) [राहत];':'(a) [relief];'))+"\n\n"
  +(kind==='grievance'?(lang==='hi'?'यदि 30 दिनों में समाधान न हो तो मैं RBI लोकपाल (cms.rbi.org.in) तक जाऊँगा/जाऊँगी और Equator में मध्यस्थता चाहूँगा/चाहूँगी।':'If unresolved within 30 days, I intend to escalate to the RBI Ombudsman (cms.rbi.org.in) and seek mediation at Equator.'):(lang==='hi'?'कृपया Equator इसे अपने नियमों के तहत संचालित करे।':'We request Equator to administer this under its Rules.'))+"\n\n_____________________\n"+(lang==='hi'?'[नाम]':'[Name]');
 document.getElementById('draftBox').innerHTML='<h2>'+(kind==='grievance'?L('draftG'):L('draftR'))+'</h2><div class="muted" style="margin-bottom:8px">'+L('disc')+'</div><textarea style="min-height:340px">'+t.replace(/</g,'&lt;')+'</textarea><div class="nav"><button class="b ghost" onclick="closeModal()">'+L('close')+'</button><button class="b primary" onclick="copyDraft(this)">'+L('copy')+'</button></div>';
 document.getElementById('draftModal').classList.add('open');}
function closeModal(){document.getElementById('draftModal').classList.remove('open');}
function copyDraft(b){const ta=document.querySelector('#draftBox textarea');ta.select();try{document.execCommand('copy');b.textContent=L('copied');}catch(e){}}
// ---------- AI ----------
function aiAnswer(q){const s=q.toLowerCase();const r=recommend();const D=L('disc');
 if(/which|route|forum|कौन|रास्ता|मंच/.test(s))return nmeL(r)+". "+r['note_'+lang]+" "+D;
 if(/ombudsman|rbi|लोकपाल|शिकायत/.test(s))return lang==='hi'?"पहले ऋणदाता के शिकायत अधिकारी को शिकायत करें। 30 दिनों में हल न हो तो नि:शुल्क RBI एकीकृत लोकपाल (cms.rbi.org.in) तक जाएँ। Equator साथ-साथ पैसे के विवाद पर मध्यस्थता कर सकता है। "+D:"First complain to the lender's grievance officer. If not resolved in 30 days, escalate FREE to the RBI Integrated Ombudsman (cms.rbi.org.in). Equator can mediate the money dispute in parallel. "+D;
 if(/cheque|138|bounce|चेक|कंपाउंड/.test(s))return lang==='hi'?"हाँ — चेक-बाउंस मामला (धारा 138) निपट सकता है। भुगतान पर (एस्क्रो से सुरक्षित), कंपाउंडिंग (धारा 147) या लोक अदालत में दर्ज कर मामला बंद होता है। जल्दी समझौते से बढ़ती लागत भी बचती है। "+D:"Yes — a cheque-bounce case (s.138) can be settled. On payment (secured via escrow), it closes by compounding (s.147) or in a Lok Adalat. Early settlement also reduces graded costs. "+D;
 if(/ots|settlement|waiver|एकमुश्त|समझौता|छूट/.test(s))return lang==='hi'?"एकमुश्त समझौता एक तय राशि है — अक्सर मूल राशि और आंशिक ब्याज, दंड शुल्क माफ़ — एकमुश्त या किश्तों में, NOC के बदले। "+D:"A one-time settlement is a negotiated figure — often principal plus part interest, penal charges waived — in one shot or instalments, for a No-Dues/NOC. "+D;
 if(/harass|agent|threat|उत्पीड़न|एजेंट|धमक/.test(s))return lang==='hi'?"वसूली एजेंटों को RBI फेयर प्रैक्टिसेज़ कोड का पालन करना होगा — कोई धमकी, असामान्य समय या अपमानजनक संपर्क नहीं। हम उत्पीड़न बढ़ाते हैं और ऋण निपटाते हैं। तत्काल खतरे में हों तो पुलिस से संपर्क करें। "+D:"Recovery agents must follow the RBI Fair Practices Code — no threats, odd-hour or abusive contact. We escalate the harassment and mediate the debt. If in immediate danger, contact the police. "+D;
 if(/credit|cibil|bureau|स्कोर|क्रेडिट/.test(s))return lang==='hi'?"हाँ — समझौते में क्रेडिट-ब्यूरो सुधार शामिल है: बंद होने पर ऋणदाता आपका रिकॉर्ड (CIBIL/CRIF/Experian) ‘समझौता/बंद’ के रूप में अपडेट करता है। "+D:"Yes — the settlement builds in a credit-bureau correction: on closure the lender updates your record (CIBIL/CRIF/Experian) to settled/closed. "+D;
 if(/confiden|private|गोपन/.test(s))return lang==='hi'?"मध्यस्थता गोपनीय और बिना-पूर्वाग्रह है — कानूनी अपवादों को छोड़कर आपकी बात अदालत में आपके विरुद्ध इस्तेमाल नहीं हो सकती। "+D:"Mediation is confidential and without prejudice — what you say can't be used against you in court, subject to legal exceptions. "+D;
 if(/time|long|days|समय|कितन/.test(s))return lang==='hi'?"अधिकांश ऋण-समझौते ~45–60 दिनों में पूरे होते हैं; चेक-बाउंस अगली अदालत/लोक-अदालत तिथि पर; लोकपाल मार्ग 30-दिन की अवधि का पालन करता है। "+D:"Most loan settlements complete in ~45–60 days; a cheque-bounce settlement closes on the next court/Lok Adalat date; the Ombudsman route follows the 30-day window. "+D;
 return lang==='hi'?"मैं सही रास्ता, RBI लोकपाल, चेक-बाउंस समझौता, OTS, उत्पीड़न, क्रेडिट सुधार, गोपनीयता, समय और मसौदे में मदद कर सकता हूँ। नीचे कोई सवाल आज़माएँ। "+D:"I can help with the right route, the RBI Ombudsman, cheque-bounce settlement, OTS, harassment, credit correction, confidentiality, timelines and drafting. Try a question below. "+D;}
function pushMsg(w,t){const l=document.getElementById('aiLog');const d=document.createElement('div');d.className='msg '+w;d.textContent=t;l.appendChild(d);l.scrollTop=l.scrollHeight;}
function ask(q){pushMsg('me',q);setTimeout(function(){pushMsg('ai',aiAnswer(q));},150);}
function askFree(e){e.preventDefault();const i=document.getElementById('aiInput');if(i.value.trim()){ask(i.value.trim());i.value='';}return false;}
function renderChips(){document.getElementById('aiChips').innerHTML=QUICK[lang].map(function(q){return '<span class="chip" onclick="ask(\''+q.replace(/'/g,"\\'")+'\')">'+q+'</span>';}).join('');}
function toggleReset(){var log=document.getElementById('aiLog');log.dataset.init='1';pushMsg('ai',L('aiHello')+" "+L('disc'));}
function toggleAI(){const p=document.getElementById('aiPanel');p.classList.toggle('open');if(p.classList.contains('open')&&!document.getElementById('aiLog').dataset.init){toggleReset();renderChips();}}
chrome();render();
