function d(x){ if(!x) return null; var p=new Date(x); return isNaN(p)?null:p; }
function addDays(dt,n){ var x=new Date(dt.getTime()); x.setDate(x.getDate()+n); return x; }

function ombTrigger(){
  var rep=d(S.dRep), rep2=d(S.dReply);

  if(rep) return addDays(rep,30);
  return null;
}
function eligibility(){
  var rep=d(S.dRep), rep2=d(S.dReply), now=today();
  var c1 = !!rep;

  var trig = ombTrigger();
  var c3 = trig ? (now <= addDays(trig,365)) : true;
  var c4 = (S.amount>0) ? (S.amount<=5000000) : true;
  var c5 = (S.pending!=='yes');
  return {c1:c1,c2:!!c2,c3:!!c3,c4:!!c4,c5:!!c5, all:(c1&&c2&&c3&&c4&&c5), trigger:trig};
}

/* ============================ render ============================ */
function render(){
  $('bar').style.width = Math.round(((step)/(STEPS-1))*100)+"%";
  $('hdTag').textContent=t('tag'); $('aiBtnTxt').textContent=t('aiBtn'); $('aiTitle').textContent=t('aiTitle');
  var h='';
  if(step===0){
    h+='<div class="step"><h1>'+t('s1h')+'</h1><div class="sub">'+t('s1s')+'</div>';
    h+='<div class="grid">';
    h+=optCard(LANG==='hi'?'रिटेल / व्यक्तिगत':'Retail / individual', LANG==='hi'?'मेरी या मेरे परिवार की व्यक्तिगत पॉलिसी — स्वास्थ्य, मोटर, जीवन, गृह, यात्रा':'A personal policy for me or my family — health, motor, life, home, travel', S.retail===true, 'setRetail(true)');
    h+=optCard(LANG==='hi'?'व्यावसायिक / व्यापार':'Commercial / business', LANG==='hi'?'कंपनी, फर्म या LLP द्वारा अपने व्यावसायिक जोखिमों के लिए ली गई पॉलिसी':'A policy taken by a company, firm or LLP for its business risks', S.retail===false, 'setRetail(false)');
    h+='</div>';
    h+='<label class="f">'+t('q_line')+'</label><select id="line" onchange="S.line=this.value">'+
       '<option value="">—</option>'+LINES[LANG].map(function(x,i){return '<option'+(S.line===LINES.en[i]?' selected':'')+' value="'+esc(LINES.en[i])+'">'+esc(x)+'</option>';}).join('')+'</select>';
    if(S.retail===false){ h+='<div class="banner b-teal">'+(LANG==='hi'
        ?'<b>ध्यान दें:</b> व्यावसायिक बीमित के लिए बीमा लोकपाल उपलब्ध नहीं है। मध्यस्थम् तभी संभव है जब दोनों पक्षों ने अलग से समझौता किया हो।'
        :'<b>Note:</b> the Insurance Ombudsman is not available to commercial insureds. Arbitration is possible only where the parties have separately agreed to it.')+'</div>'; }
    if(S.retail===true){ h+='<div class="banner b-gold">'+(LANG==='hi'
        ?'<b>अच्छी खबर:</b> रिटेल पॉलिसी के लिए एक निःशुल्क सरकारी मंच है — बीमा लोकपाल। और 27 अक्टूबर 2023 के IRDAI परिपत्र के बाद रिटेल पॉलिसियों में मध्यस्थम् खंड नहीं होना चाहिए।'
        :'<b>Good news:</b> for a retail policy there is a free government forum — the Insurance Ombudsman. And since the IRDAI circular of 27 October 2023, retail policies are not to carry an arbitration clause.')+'</div>'; }
    h+=nav(false, S.retail!==null);
    h+='</div>';
  }
  else if(step===1){
    h+='<div class="step"><h1>'+t('s2h')+'</h1><div class="sub">'+t('s2s')+'</div>';
    h+=DTYPES[LANG].map(function(x,i){return chip(x, DTYPES.en[i], S.dtypes, 'dtypes');}).join('');
    h+=nav(true, S.dtypes.length>0)+'</div>';
  }
  else if(step===2){
    h+='<div class="step"><h1>'+t('s3h')+'</h1><div class="sub">'+t('s3s')+'</div>';
    h+=GROUNDS[LANG].map(function(x,i){return chip(x, GROUNDS.en[i], S.grounds, 'grounds');}).join('');
    h+='<div class="banner b-teal" style="margin-top:16px">'+(LANG==='hi'
      ?'यदि बीमा कंपनी ने कारण लिखित में नहीं दिए, तो पहला काम यही है कि लिखित, सकारण निर्णय माँगा जाए।'
      :'If the insurer did not give reasons in writing, the first task is to ask for a reasoned decision in writing.')+'</div>';
    h+=nav(true,true)+'</div>';
  }
  else if(step===3){
    h+='<div class="step"><h1>'+t('s4h')+'</h1><div class="sub">'+t('s4s')+'</div>';
    h+='<div class="grid">';
    h+='<div><label class="f">'+t('q_loss')+'</label><input type="date" value="'+S.dLoss+'" onchange="S.dLoss=this.value"/></div>';
    h+='<div><label class="f">'+t('q_letter')+'</label><input type="date" value="'+S.dLetter+'" onchange="S.dLetter=this.value"/></div>';
    h+='<div><label class="f">'+t('q_rep')+'</label><input type="date" value="'+S.dRep+'" onchange="S.dRep=this.value"/></div>';
    h+='<div><label class="f">'+t('q_reply')+'</label><input type="date" value="'+S.dReply+'" onchange="S.dReply=this.value"/></div>';
    h+='<div><label class="f">'+t('q_amt')+'</label><input type="number" min="0" value="'+(S.amount||'')+'" onchange="S.amount=parseFloat(this.value)||0"/></div>';
    h+='<div><label class="f">'+t('q_outcome')+'</label><select onchange="S.outcome=this.value">'+
       ['','rejected','unsatisfactory','satisfactory','none'].map(function(v){
         var lab={'':'—','rejected':LANG==='hi'?'अस्वीकृत':'a rejection','unsatisfactory':LANG==='hi'?'असंतोषजनक':'unsatisfactory','satisfactory':LANG==='hi'?'संतोषजनक':'satisfactory','none':LANG==='hi'?'कोई उत्तर नहीं':'no reply at all'}[v];
         return '<option value="'+v+'"'+(S.outcome===v?' selected':'')+'>'+lab+'</option>';}).join('')+'</select></div>';
    h+='<div><label class="f">'+t('q_pending')+'</label><select onchange="S.pending=this.value">'+
       ['','no','yes'].map(function(v){var lab={'':'—','no':LANG==='hi'?'नहीं':'No','yes':LANG==='hi'?'हाँ':'Yes'}[v];
         return '<option value="'+v+'"'+(S.pending===v?' selected':'')+'>'+lab+'</option>';}).join('')+'</select></div>';
    h+='</div>';
    h+='<div class="banner b-red" style="margin-top:16px"><b>'+(LANG==='hi'?'सबसे ज़रूरी बात:':'The most important thing:')+'</b> '+
       (LANG==='hi'?'बीमा कंपनी के उत्तर से एक वर्ष के भीतर ही बीमा लोकपाल के पास जाया जा सकता है। यह समय-सीमा किसी कारण से नहीं रुकती — मध्यस्थता से भी नहीं।'
                   :'You have one year from the insurer\'s reply to go to the Insurance Ombudsman. That deadline does not pause for anything — including for mediation.')+'</div>';
    h+=nav(true,true)+'</div>';
  }
  else {
    h+=results();
  }
  $('app').innerHTML=h;
}
function optCard(title,sub,sel,fn){
  return '<div class="opt'+(sel?' sel':'')+'" onclick="'+fn+'"><b>'+esc(title)+'</b><small>'+esc(sub)+'</small></div>';
}
function chip(label,val,arr,key){
  var sel=arr.indexOf(val)>-1;
  return '<span class="chip'+(sel?' sel':'')+'" onclick="tog(\''+key+'\',\''+val.replace(/'/g,"\\'")+'\')">'+esc(label)+'</span>';
}
function tog(key,val){ var a=S[key], i=a.indexOf(val); if(i>-1)a.splice(i,1); else a.push(val); render(); }
function setRetail(v){ S.retail=v; render(); }
function nav(showBack,canNext){
  return '<div class="nav">'+
    (showBack?'<button class="ghost" onclick="step--;render()">'+t('back')+'</button>':'<span></span>')+
    '<button class="primary" '+(canNext?'':'disabled style="opacity:.45;cursor:not-allowed"')+' onclick="step++;render()">'+t('next')+'</button></div>';
}

     (S.retail? (hi?'बीमा लोकपाल आपके लिए उपलब्ध है और निःशुल्क है। रिटेल पॉलिसी में मध्यस्थम् खंड नहीं होना चाहिए (IRDAI, 27 अक्टूबर 2023)।'

  room:"आनुपातिक कटौती उन शुल्कों को घटाती है जो कमरे की श्रेणी के साथ बदलते हैं। पूछने योग्य प्रश्न यह है कि क्या वह शुल्क वास्तव में कमरे की श्रेणी से बदलता है — सर्जन शुल्क, निश्चेतक और इम्प्लांट सामान्यतः नहीं बदलते। यह भी देखें कि को-पे आनुपातिक कटौती के बाद तो नहीं लगाया गया, जिससे वही कटौती दो बार गिनी जाती है।",
  ped:"पूर्व-विद्यमान रोग के आधार में तारीखें चिकित्सा से अधिक निर्णायक होती हैं। महत्वपूर्ण है: निरंतर कवर की प्रथम आरंभ तिथि, भर्ती की तिथि तक प्रतीक्षा अवधि पूरी हुई या नहीं, और पोर्ट किया हो तो निरंतरता का लाभ आगे बढ़ा या नहीं।",
  s45:"बीमा अधिनियम, 1938 की धारा 45 वैधानिक अवधि बीत जाने के बाद जीवन पॉलिसी पर प्रश्न उठाने से रोकती है — यह अवधि जारी होने, जोखिम आरंभ, पुनर्चालन या राइडर में से बाद वाली तिथि से चलती है। साथ ही आधार लिखित रूप में, संबंधित सामग्रियों सहित सूचित करना आवश्यक है। पहले तारीखें जाँचें। वर्तमान पाठ की पुष्टि अवश्य करें।",
  voucher:"जिस राशि से आप असहमत हैं उसके लिए 'फुल एंड फाइनल' वाउचर पर सीधे हस्ताक्षर न करें। हस्ताक्षर के ऊपर लिखें: \"₹____ खाते में, विरोध के अधीन प्राप्त। शेष ₹____ का दावा करने का अधिकार सुरक्षित।\" विरोध के अधीन हस्ताक्षरित वाउचर स्वयं में शेष का दावा नहीं रोकता।",
  bharosa:"बीमा भरोसा IRDAI की निःशुल्क ऑनलाइन शिकायत प्रणाली है। बीमा कंपनी को लिखते समय ही वहाँ भी शिकायत दर्ज करें और टोकन नंबर रखें — यह शिकायत की तारीख का स्वतंत्र प्रमाण है।",
  missell:"2021 के संशोधन के बाद बीमा लोकपाल के दायरे में सेवा में कमी तथा एजेंट, ब्रोकर व अन्य मध्यवर्तियों की शिकायतें भी आती हैं। लाभ-चित्रण, प्रस्ताव फॉर्म, कॉल रिकॉर्डिंग और बैंक विवरण जुटाएँ। यहाँ समाधान केवल धन-वापसी तक सीमित नहीं — पेड-अप में रूपांतरण, भावी प्रीमियम की छूट, या उत्पाद प्रतिस्थापन भी संभव है।",
  consumer:"उपभोक्ता उपचार एक स्वतंत्र वैधानिक अधिकार है और किसी मध्यस्थम् खंड से छीना नहीं जा सकता। पर क्रम का ध्यान रखें: उपभोक्ता आयोग में दाखिल करने के बाद लोकपाल उसी मामले पर विचार नहीं कर सकते।",
  fraud:"जहाँ बीमा कंपनी जाली दस्तावेज़ या रचे गए नुकसान का आरोप लगाती है, हम उसमें मध्यस्थता नहीं करते। उसकी जाँच होनी चाहिए या मुकदमा चलना चाहिए। मैं आपको केस मैनेजर से जोड़ता हूँ।",
  bereaved:"मुझे खेद है। हम आपकी सुविधा की गति से चल सकते हैं, और यह सब आपको अकेले नहीं करना है। एक तारीख आज बता देना ज़रूरी है क्योंकि वह प्रतीक्षा नहीं करती — उसके बाद हम रुक सकते हैं। मैं केस मैनेजर को जोड़ता हूँ।",
  def:"मैं तीन चीज़ों में मदद कर सकता हूँ: कौन-सा मंच आपके लिए खुला है, आपकी समय-सीमाएँ क्या हैं, और शिकायत का प्रारूप तैयार करना जिसे हमारी टीम का कोई व्यक्ति जाँचेगा। मैं यह नहीं बता सकता कि दावा सफल होगा या उसका मूल्य क्या है। किससे शुरू करें?"
 }
};
var CHIPS={
 en:["Is the Ombudsman free?","What are my deadlines?","Should I arbitrate?","Are you the government?","Why was my room rent cut?","They say it was pre-existing","Should I sign the discharge voucher?","Will I win?","How much will I get?"],
 hi:["क्या लोकपाल निःशुल्क है?","मेरी समय-सीमाएँ क्या हैं?","क्या मुझे मध्यस्थम् में जाना चाहिए?","क्या आप सरकारी हैं?","रूम रेंट पर कटौती क्यों?","वे कहते हैं यह पूर्व-विद्यमान था","क्या डिस्चार्ज वाउचर पर हस्ताक्षर करूँ?","क्या मैं जीतूँगा?","मुझे कितना मिलेगा?"]
};
function toggleAI(){ var p=$('aiPanel'); p.classList.toggle('open'); if(p.classList.contains('open')&&!$('aiLog').innerHTML) aiBoot(); }
function aiBoot(){
  $('aiLog').innerHTML=''; say('ai', AI_ANS[LANG].def); renderChips();
}
function renderChips(){
  $('aiChips').innerHTML = CHIPS[LANG].map(function(c,i){
    return '<span class="chip" onclick="askChip('+i+')">'+esc(c)+'</span>';}).join('');
}
function say(who,txt){ var l=$('aiLog'); var dv=document.createElement('div'); dv.className='msg '+who; dv.textContent=txt; l.appendChild(dv); l.scrollTop=l.scrollHeight; }
function answer(q){
  for(var i=0;i<AI_RULES.length;i++){ if(AI_RULES[i].re.test(q)) return AI_ANS[LANG][AI_RULES[i].k]||AI_ANS[LANG].def; }
  return AI_ANS[LANG].def;
}
function askChip(i){ var q=CHIPS[LANG][i]; say('me',q); setTimeout(function(){ say('ai',answer(q)); },220); }
function askFree(e){ e.preventDefault(); var v=$('aiInput').value.trim(); if(!v) return false;
  say('me',v); $('aiInput').value=''; setTimeout(function(){ say('ai',answer(v)); },220); return false; }

function setLang(l){ LANG=l; $('lEN').className = l==='en'?'on':''; $('lHI').className = l==='hi'?'on':'';
  if($('aiLog').innerHTML) aiBoot(); render(); }
render();
</script>
