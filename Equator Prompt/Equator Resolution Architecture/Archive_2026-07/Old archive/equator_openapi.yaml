openapi: 3.1.0
info:
  title: Equator Resolution — Public API
  version: "1.0.0"
  summary: ODR platform API for lender integration, embedded dispute resolution, and partner automation.
  description: |
    The Equator Resolution API lets lenders (NBFCs), enterprises and marketplaces
    initiate and track dispute-resolution cases programmatically, embed ODR into
    their own products, and receive real-time updates via webhooks.

    ## Highlights
    - **Bulk case intake** for high-volume NBFC / lending disputes (idempotent on `external_ref`).
    - **Single case filing** for commercial, family and grievance pillars.
    - **Case status & timeline** with the statutory-clock state machine.
    - **Neutrals, documents, e-sign and payments** sub-resources.
    - **Webhooks** for case lifecycle events (signed via HMAC).

    ## Conventions
    - All IDs are UUIDs. All timestamps are ISO 8601 (UTC). Money is minor-unit-free decimal with an ISO 4217 `currency`.
    - This spec is consistent with the Equator data model (see the Forms & Database Specification).
    - Field names use `snake_case` and match the database columns.

    ## Versioning
    - The API is versioned in the path (`/v1`). Breaking changes ship under a new major version.
  contact:
    name: Equator Resolution — Developer Platform
    email: developers@equatorresolution.example
  license:
    name: Proprietary — Confidential
servers:
  - url: https://api.equatorresolution.example/v1
    description: Production
  - url: https://sandbox.api.equatorresolution.example/v1
    description: Sandbox (test data, no real notices sent)

security:
  - bearerAuth: []

tags:
  - name: Authentication
    description: Obtain and refresh access tokens.
  - name: Cases
    description: Create and manage dispute-resolution cases.
  - name: Bulk Intake
    description: High-volume case creation for lenders.
  - name: Parties
    description: Parties and their representatives on a case.
  - name: Neutrals
    description: Empanelled arbitrators, mediators and conciliators.
  - name: Hearings
    description: Scheduling and notices.
  - name: Documents
    description: Evidence, orders, awards and settlement files.
  - name: Signatures
    description: e-Signature requests for awards and settlements.
  - name: Payments
    description: Filing fees, invoices and payments.
  - name: Webhooks
    description: Event subscriptions and delivery (callbacks you receive).

paths:
  /auth/token:
    post:
      tags: [Authentication]
      summary: Obtain an access token
      description: Exchange client credentials (issued per tenant) for a short-lived bearer token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, client_secret, grant_type]
              properties:
                client_id: { type: string }
                client_secret: { type: string, format: password }
                grant_type: { type: string, enum: [client_credentials], default: client_credentials }
      responses:
        "200":
          description: Token issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token: { type: string }
                  token_type: { type: string, example: Bearer }
                  expires_in: { type: integer, example: 3600 }
                  scope: { type: string, example: "cases:write cases:read webhooks:manage" }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /cases:
    get:
      tags: [Cases]
      summary: List cases
      parameters:
        - { in: query, name: pillar, schema: { $ref: '#/components/schemas/Pillar' } }
        - { in: query, name: status, schema: { $ref: '#/components/schemas/CaseStatus' } }
        - { in: query, name: external_ref, schema: { type: string }, description: "Your reference such as a loan ID." }
        - { in: query, name: created_after, schema: { type: string, format: date-time } }
        - { in: query, name: page, schema: { type: integer, default: 1, minimum: 1 } }
        - { in: query, name: page_size, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        "200":
          description: A page of cases.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Case' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        "401": { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Cases]
      summary: File a single case
      description: |
        Creates one case (commercial, family, NBFC or grievance). For high volume use **Bulk Intake**.
        Supply an `Idempotency-Key` header to safely retry.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CaseCreate' }
            examples:
              commercial:
                summary: Commercial arbitration
                value:
                  pillar: COMMERCIAL
                  mechanism: ARBITRATION
                  ruleset_code: IN-ARB-1996
                  claim_value: 4200000
                  claim_currency: INR
                  external_ref: "PO-2025-0098"
                  parties:
                    - role: CLAIMANT
                      party_kind: ENTITY
                      display_name: "BluePeak Pvt Ltd"
                      email: "legal@bluepeak.example"
                    - role: RESPONDENT
                      party_kind: ENTITY
                      display_name: "Orion Industries"
                      email: "ops@orion.example"
                  claim_summary: "Breach of supply agreement; retention wrongfully withheld."
                  relief_sought: "Recovery of retention with interest and costs."
      responses:
        "201":
          description: Case created (status REGISTERED or FILED depending on fee gating).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "422": { $ref: '#/components/responses/ValidationError' }

  /cases/{case_id}:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
    get:
      tags: [Cases]
      summary: Get a case
      responses:
        "200":
          description: The case.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Case' }
        "404": { $ref: '#/components/responses/NotFound' }

  /cases/{case_id}/timeline:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
    get:
      tags: [Cases]
      summary: Get a case timeline (state transitions & events)
      responses:
        "200":
          description: Ordered list of events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CaseEvent' }
        "404": { $ref: '#/components/responses/NotFound' }

  /cases/{case_id}/parties:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
    get:
      tags: [Parties]
      summary: List parties on a case
      responses:
        "200":
          description: Parties.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Party' }

  /bulk/cases:
    post:
      tags: [Bulk Intake]
      summary: Create many cases (NBFC bulk intake)
      description: |
        Submit a batch of loan/borrower disputes. Processing is asynchronous: valid rows
        become cases; invalid rows go to an exception list you can fetch. Idempotent on
        `(tenant, external_ref)` — re-submitting the same `external_ref` will not duplicate.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkCaseRequest' }
            examples:
              lender:
                value:
                  batch_ref: "ACME-2026-06-W4"
                  ruleset_code: IN-NBFC-LADDER
                  callback_url: "https://acme.example/odr/webhook"
                  cases:
                    - external_ref: "LN-882301"
                      mechanism: CONCILIATION
                      claim_value: 142000
                      claim_currency: INR
                      clause_present: true
                      borrower:
                        display_name: "Ravi Menon"
                        phone: "+919800000231"
                        email: "ravi@example.com"
                    - external_ref: "LN-882303"
                      mechanism: CONCILIATION
                      claim_value: 96000
                      claim_currency: INR
                      clause_present: true
                      borrower:
                        phone: "+919000000145"
      responses:
        "202":
          description: Batch accepted for processing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkBatch' }
        "400": { $ref: '#/components/responses/BadRequest' }
        "422": { $ref: '#/components/responses/ValidationError' }

  /bulk/cases/{batch_id}:
    parameters:
      - { in: path, name: batch_id, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Bulk Intake]
      summary: Get bulk batch status (counts + exceptions)
      responses:
        "200":
          description: Batch status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BulkBatch' }
        "404": { $ref: '#/components/responses/NotFound' }

  /neutrals:
    get:
      tags: [Neutrals]
      summary: List empanelled neutrals
      parameters:
        - { in: query, name: neutral_type, schema: { $ref: '#/components/schemas/NeutralType' } }
        - { in: query, name: domain, schema: { type: string, example: NBFC } }
        - { in: query, name: language, schema: { type: string, example: hi } }
      responses:
        "200":
          description: Neutrals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Neutral' }

  /cases/{case_id}/hearings:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
    get:
      tags: [Hearings]
      summary: List hearings for a case
      responses:
        "200":
          description: Hearings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Hearing' }
    post:
      tags: [Hearings]
      summary: Schedule a hearing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HearingCreate' }
      responses:
        "201":
          description: Hearing scheduled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hearing' }

  /cases/{case_id}/documents:
    parameters:
      - { $ref: '#/components/parameters/CaseId' }
    get:
      tags: [Documents]
      summary: List case documents
      responses:
        "200":
          description: Documents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Document' }
    post:
      tags: [Documents]
      summary: Request a document upload URL
      description: Returns a short-lived signed URL to PUT the file to object storage, plus the document record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doc_type, file_name, mime_type]
              properties:
                doc_type: { $ref: '#/components/schemas/DocType' }
                file_name: { type: string }
                mime_type: { type: string, example: application/pdf }
      responses:
        "201":
          description: Upload URL issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  document: { $ref: '#/components/schemas/Document' }
                  upload_url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }

  /signatures:
    post:
      tags: [Signatures]
      summary: Create an e-signature request
      description: Initiate certified e-signature on an award or settlement document.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document_id, signers]
              properties:
                document_id: { type: string, format: uuid }
                signers:
                  type: array
                  items:
                    type: object
                    required: [name, email, order]
                    properties:
                      name: { type: string }
                      email: { type: string, format: email }
                      order: { type: integer, minimum: 1 }
                provider: { type: string, enum: [AADHAAR_ESIGN, CERTIFIED, DOCUSIGN], default: AADHAAR_ESIGN }
      responses:
        "201":
          description: Signature request created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignatureRequest' }

  /invoices:
    post:
      tags: [Payments]
      summary: Raise an invoice (e.g., filing fee)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, currency, payer_email]
              properties:
                case_id: { type: string, format: uuid }
                amount: { type: number, example: 4800 }
                currency: { type: string, example: INR }
                payer_email: { type: string, format: email }
                description: { type: string, example: "Conciliation fee" }
      responses:
        "201":
          description: Invoice raised with a hosted payment link.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }

  /webhooks/subscriptions:
    get:
      tags: [Webhooks]
      summary: List webhook subscriptions
      responses:
        "200":
          description: Subscriptions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/WebhookSubscription' }
    post:
      tags: [Webhooks]
      summary: Create a webhook subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url: { type: string, format: uri }
                events:
                  type: array
                  items: { $ref: '#/components/schemas/EventType' }
      responses:
        "201":
          description: Subscription created. The `signing_secret` is returned once.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WebhookSubscription'
                  - type: object
                    properties:
                      signing_secret: { type: string, description: HMAC-SHA256 secret; store securely. }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token from POST /auth/token.

  parameters:
    CaseId:
      in: path
      name: case_id
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string }
      description: A unique key to make POSTs safely retryable.

  responses:
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Request failed field validation.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  field_errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field: { type: string }
                        message: { type: string }

  schemas:
    Pillar:
      type: string
      enum: [FAMILY, NBFC, COMMERCIAL, GRIEVANCE]
    Mechanism:
      type: string
      enum: [MEDIATION, ARBITRATION, CONCILIATION, NEGOTIATION]
    CaseStatus:
      type: string
      enum: [DRAFT, FILED, REGISTERED, NOTICE_SERVED, NEUTRAL_APPOINTED, IN_RESOLUTION, SETTLEMENT_DRAFTED, AWARD_DRAFTED, SIGNED, CLOSED_RESOLVED, CLOSED_UNRESOLVED, ESCALATED]
    ConfidentialityTier:
      type: string
      enum: [STANDARD, HIGH, POSH]
    CaseSource:
      type: string
      enum: [SELF, CLAUSE, BULK, API, ESCALATION]
    PartyRole:
      type: string
      enum: [CLAIMANT, RESPONDENT, THIRD_PARTY]
    PartyKind:
      type: string
      enum: [INDIVIDUAL, ENTITY]
    NeutralType:
      type: string
      enum: [ARBITRATOR, MEDIATOR, CONCILIATOR]
    DocType:
      type: string
      enum: [EVIDENCE, PLEADING, ORDER, AWARD, MSA, KYC, OTHER]
    EventType:
      type: string
      enum: [case.filed, case.registered, case.state_changed, neutral.appointed, hearing.scheduled, settlement.reached, award.signed, grievance.escalated, payment.captured, sla.at_risk]

    Pagination:
      type: object
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    PartyInput:
      type: object
      required: [role, party_kind, display_name]
      properties:
        role: { $ref: '#/components/schemas/PartyRole' }
        party_kind: { $ref: '#/components/schemas/PartyKind' }
        display_name: { type: string }
        email: { type: string, format: email }
        phone: { type: string }

    Party:
      allOf:
        - $ref: '#/components/schemas/PartyInput'
        - type: object
          properties:
            party_id: { type: string, format: uuid }
            case_id: { type: string, format: uuid }

    CaseCreate:
      type: object
      required: [pillar, mechanism, parties]
      properties:
        pillar: { $ref: '#/components/schemas/Pillar' }
        mechanism: { $ref: '#/components/schemas/Mechanism' }
        ruleset_code: { type: string, example: IN-ARB-1996, description: Governing ruleset (jurisdiction + pillar). }
        claim_value: { type: number, nullable: true }
        claim_currency: { type: string, default: INR }
        external_ref: { type: string, nullable: true, description: Your reference (loan/contract ID). }
        clause_present: { type: boolean, default: false }
        claim_summary: { type: string }
        relief_sought: { type: string }
        parties:
          type: array
          minItems: 2
          items: { $ref: '#/components/schemas/PartyInput' }

    Case:
      type: object
      properties:
        case_id: { type: string, format: uuid }
        case_number: { type: string, example: "EQ/ARB/2026/000123" }
        tenant_id: { type: string, format: uuid }
        pillar: { $ref: '#/components/schemas/Pillar' }
        mechanism: { $ref: '#/components/schemas/Mechanism' }
        status: { $ref: '#/components/schemas/CaseStatus' }
        confidentiality_tier: { $ref: '#/components/schemas/ConfidentialityTier' }
        source: { $ref: '#/components/schemas/CaseSource' }
        claim_value: { type: number, nullable: true }
        claim_currency: { type: string, example: INR }
        external_ref: { type: string, nullable: true }
        ruleset_code: { type: string, example: IN-ARB-1996 }
        filed_at: { type: string, format: date-time, nullable: true }
        registered_at: { type: string, format: date-time, nullable: true }
        sla_due_at: { type: string, format: date-time, nullable: true, description: Computed statutory deadline. }
        created_at: { type: string, format: date-time }

    CaseEvent:
      type: object
      properties:
        event_id: { type: string, format: uuid }
        event_type: { type: string, example: case.state_changed }
        from_state: { $ref: '#/components/schemas/CaseStatus' }
        to_state: { $ref: '#/components/schemas/CaseStatus' }
        occurred_at: { type: string, format: date-time }

    BulkBorrower:
      type: object
      properties:
        display_name: { type: string, nullable: true }
        phone: { type: string }
        email: { type: string, format: email, nullable: true }

    BulkCaseRow:
      type: object
      required: [external_ref, mechanism]
      properties:
        external_ref: { type: string, description: Loan account ID (idempotency key within the tenant). }
        mechanism: { $ref: '#/components/schemas/Mechanism' }
        claim_value: { type: number }
        claim_currency: { type: string, default: INR }
        clause_present: { type: boolean, default: true }
        default_details: { type: string, nullable: true }
        borrower: { $ref: '#/components/schemas/BulkBorrower' }

    BulkCaseRequest:
      type: object
      required: [batch_ref, cases]
      properties:
        batch_ref: { type: string }
        ruleset_code: { type: string, example: IN-NBFC-LADDER }
        callback_url: { type: string, format: uri, nullable: true }
        cases:
          type: array
          minItems: 1
          maxItems: 10000
          items: { $ref: '#/components/schemas/BulkCaseRow' }

    BulkBatch:
      type: object
      properties:
        batch_id: { type: string, format: uuid }
        batch_ref: { type: string }
        status: { type: string, enum: [PROCESSING, COMPLETED, FAILED] }
        total_rows: { type: integer }
        valid_rows: { type: integer }
        error_rows: { type: integer }
        created_case_ids:
          type: array
          items: { type: string, format: uuid }
        exceptions:
          type: array
          items:
            type: object
            properties:
              external_ref: { type: string }
              error: { type: string }

    Neutral:
      type: object
      properties:
        neutral_id: { type: string, format: uuid }
        display_name: { type: string }
        neutral_type:
          type: array
          items: { $ref: '#/components/schemas/NeutralType' }
        domains:
          type: array
          items: { type: string }
        languages:
          type: array
          items: { type: string }
        years_experience: { type: integer }
        empanelment_status: { type: string, enum: [EMPANELLED] }

    HearingCreate:
      type: object
      required: [scheduled_at, mode]
      properties:
        scheduled_at: { type: string, format: date-time }
        mode: { type: string, enum: [VIDEO, AUDIO, IN_PERSON, ASYNC] }
        serve_notice: { type: boolean, default: true }
        channels:
          type: array
          items: { type: string, enum: [EMAIL, SMS, WHATSAPP] }

    Hearing:
      allOf:
        - $ref: '#/components/schemas/HearingCreate'
        - type: object
          properties:
            hearing_id: { type: string, format: uuid }
            case_id: { type: string, format: uuid }
            status: { type: string, enum: [SCHEDULED, HELD, ADJOURNED, CANCELLED] }
            video_url: { type: string, format: uri, nullable: true }

    Document:
      type: object
      properties:
        document_id: { type: string, format: uuid }
        case_id: { type: string, format: uuid, nullable: true }
        doc_type: { $ref: '#/components/schemas/DocType' }
        file_name: { type: string }
        mime_type: { type: string }
        confidentiality_tier: { $ref: '#/components/schemas/ConfidentialityTier' }
        uploaded_at: { type: string, format: date-time, nullable: true }

    SignatureRequest:
      type: object
      properties:
        signature_request_id: { type: string, format: uuid }
        document_id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, PARTIALLY_SIGNED, COMPLETED, DECLINED] }
        provider: { type: string }
        sign_urls:
          type: array
          items:
            type: object
            properties:
              email: { type: string, format: email }
              url: { type: string, format: uri }

    Invoice:
      type: object
      properties:
        invoice_id: { type: string, format: uuid }
        case_id: { type: string, format: uuid, nullable: true }
        amount: { type: number }
        currency: { type: string }
        status: { type: string, enum: [RAISED, PAID, PART_PAID, VOID] }
        payment_url: { type: string, format: uri }

    WebhookSubscription:
      type: object
      properties:
        subscription_id: { type: string, format: uuid }
        url: { type: string, format: uri }
        events:
          type: array
          items: { $ref: '#/components/schemas/EventType' }
        active: { type: boolean }
        created_at: { type: string, format: date-time }

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: validation_error }
            message: { type: string, example: "claim_currency must be a valid ISO 4217 code." }
            request_id: { type: string }

webhooks:
  caseEvent:
    post:
      summary: Case lifecycle event (delivered to your subscribed URL)
      description: |
        Equator POSTs an event to your subscription URL. The request is signed with
        `X-Equator-Signature: sha256=<hmac>` using your subscription `signing_secret`.
        Respond `2xx` within 5 seconds; non-2xx responses are retried with backoff.
      requestBody:
        content:
          application/json:
            schema:
